services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ expects the mount at /var/lib/postgresql (not .../data)
      - idac_drd_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: compose/django/Dockerfile
    command: >
      bash -c "python manage.py migrate --noinput &&
               python manage.py collectstatic --noinput &&
               python manage.py shell -c \"from django.contrib.auth import get_user_model; U=get_user_model(); U.objects.filter(username='admin').exists() or U.objects.create_superuser('admin','admin@linea.org.br','admin')\" &&
               uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@database:5432/postgres
      DJANGO_DEBUG: "True"
      DJANGO_READ_DOT_ENV_FILE: "False"
    volumes:
      - ../../:/app
    expose:
      - "8000"
    depends_on:
      database:
        condition: service_healthy

  # build do frontend em watch: recompila o bundle (idac_drd/static/frontend)
  # a cada mudança em frontend/src — o Django serve o resultado (sem node no host)
  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    command: sh -c "npm install && npm run build -- --watch"
    volumes:
      - ../../:/app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  idac_drd_pg:
