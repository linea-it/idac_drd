# Identidades externas de assignees (email -> github_handle + slack_id).
# Ingestão única na primeira vez: python manage.py loaddata identities
# Depois disso, novos registros são cadastrados via admin do Django.
# O email é sempre <username>@linea.org.br, onde username = uid do SAML (com '.' vira '_').
# slack_ids coletados do canal C06JSRLF2JU em 2026-08-15.
# github_handle: cruzados com autores de commits da org linea-it (2026-08-15).
# glpi_id: id do usuário no GLPI (Administração → Usuários) — preencher
# manualmente; sem o id o ticket não é atribuído. Em instalações que já rodaram
# loaddata, atualizar via admin do Django (ou apagar os registros e recarregar).
- model: users.externalidentity
  pk: 1
  fields:
    email: carlosadean@linea.org.br
    github_handle: carlosadean
    name: Carlos Adean
    slack_id: U0E8BJ9EX
    glpi_id: 22
