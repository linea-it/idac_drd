{% extends "base.html" %}

{% block title %}Login — IDAC-DR Dashboard{% endblock %}

{% block content %}

    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-3">Sign in</h1>
          <p class="text-muted">Choose your identity provider.</p>
          <div class="d-grid gap-2">
            <a class="btn btn-primary" href="{{ settings.LINEA_LOGIN_URL }}">LIneA / CILogon</a>
            <a class="btn btn-outline-primary" href="{{ settings.RUBIN_LOGIN_URL }}">Rubin</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
