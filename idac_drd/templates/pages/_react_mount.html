{% csrf_token %}
<div id="idac-drd-root"
     data-page="{{ page }}"
     data-authenticated="{% if request.user.is_authenticated %}true{% else %}false{% endif %}"
     data-is-staff="{% if request.user.is_staff %}true{% else %}false{% endif %}"
     data-is-superuser="{% if request.user.is_superuser %}true{% else %}false{% endif %}"
     data-user-email="{{ request.user.email|default:'' }}"
     data-login-url="{% if settings.AUTH_SAML2_ENABLED %}{{ settings.LINEA_LOGIN_URL }}{% else %}{% url 'admin:login' %}?next={{ request.META.SCRIPT_NAME }}{{ request.path }}{% endif %}"
     data-api-prefix="{{ request.META.SCRIPT_NAME }}"
     data-csrf-token="{{ csrf_token }}"
     {% if release_slug %}data-release-slug="{{ release_slug }}"{% endif %}></div>
<script type="module" src="{% static 'frontend/assets/main.js' %}"></script>
